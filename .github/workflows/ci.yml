name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 8.3 links the system's libxml2, 8.4 parses with its own HTML5 parser.
        php: ["8.3", "8.4"]
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm run test:types
      - run: pnpm run lint
      - run: pnpm exec prettier --check "src/panel/**"
      - run: pnpm exec vitest run
